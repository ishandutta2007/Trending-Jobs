<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <!-- Definitions for gradients and effects -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Trendline Glowing Gradient -->
    <linearGradient id="trend-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="1" />
    </linearGradient>

    <!-- Drop Shadows and Glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="300" fill="url(#bg-grad)" rx="16" />

  <!-- Ambient Glow Behind Elements -->
  <circle cx="700" cy="80" r="120" fill="#818cf8" opacity="0.15" filter="url(#glow)" />
  <circle cx="100" cy="220" r="100" fill="#38bdf8" opacity="0.1" filter="url(#glow)" />

  <!-- Decorative Grid (Dynamic Perspective) -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.4">
    <!-- Horizontal lines -->
    <line x1="50" y1="60" x2="750" y2="60" />
    <line x1="50" y1="120" x2="750" y2="120" />
    <line x1="50" y1="180" x2="750" y2="180" />
    <line x1="50" y1="240" x2="750" y2="240" />
    <!-- Vertical lines -->
    <line x1="150" y1="40" x2="150" y2="260" />
    <line x1="300" y1="40" x2="300" y2="260" />
    <line x1="450" y1="40" x2="450" y2="260" />
    <line x1="600" y1="40" x2="600" y2="260" />
  </g>

  <!-- Dynamic Rising Trend Graph Accent (Right Side) -->
  <path d="M 480 230 Q 560 210, 620 130 T 740 70" 
        fill="none" 
        stroke="url(#text-grad)" 
        stroke-width="4" 
        stroke-linecap="round"
        filter="url(#glow)" />
  
  <!-- Glowing Nodes on the trendline -->
  <circle cx="480" cy="230" r="5" fill="#6366f1" />
  <circle cx="583" cy="180" r="5" fill="#818cf8" />
  <circle cx="660" cy="110" r="6" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="740" cy="70" r="8" fill="#c084fc" filter="url(#glow)" />

  <!-- Graph Fill area underneath -->
  <path d="M 480 230 Q 560 210, 620 130 T 740 70 L 740 260 L 480 260 Z" 
        fill="url(#trend-grad)" 
        opacity="0.15" />

  <!-- Banner Content Text -->
  <g transform="translate(60, 110)">
    <!-- Category Badge -->
    <rect x="0" y="-45" width="130" height="24" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="15" y="-29" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" letter-spacing="1.5">MARKET ANALYSIS</text>

    <!-- Main Title -->
    <text x="0" y="20" fill="url(#text-grad)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">Trending Jobs</text>
    
    <!-- Subtitle -->
    <text x="2" y="55" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Market Growth &amp; Role Demand Comparison (2021–2026)</text>
  </g>

  <!-- Decorative Sparkles/Accents -->
  <path d="M 280, 50 L 285, 60 L 295, 65 L 285, 70 L 280, 80 L 275, 70 L 265, 65 L 275, 60 Z" fill="#c084fc" opacity="0.7" />
  <path d="M 440, 240 L 443, 247 L 450, 250 L 443, 253 L 440, 260 L 437, 253 L 430, 250 L 437, 247 Z" fill="#38bdf8" opacity="0.6" />
</svg>
